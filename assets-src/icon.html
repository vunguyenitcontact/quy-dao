<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#08091f}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2378"/><stop offset="1" stop-color="#08091f"/></linearGradient>
    <radialGradient id="neb" cx="0.25" cy="0.2" r="0.7"><stop offset="0" stop-color="#7c5aff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="0.9" cy="0.85" r="0.6"><stop offset="0" stop-color="#ff6eaa" stop-opacity=".35"/><stop offset="1" stop-color="#ff6eaa" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx="0.36" cy="0.32" r="0.75"><stop offset="0" stop-color="#fff1b8"/><stop offset=".55" stop-color="#ffc24b"/><stop offset="1" stop-color="#9a4f13"/></radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff8fb1" stop-opacity="0"/><stop offset="1" stop-color="#7ef0ff"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7ef0ff" stop-opacity=".9"/><stop offset="1" stop-color="#7ef0ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#neb)"/>
  <rect width="1024" height="1024" fill="url(#neb2)"/>
  <g fill="#fff">
    <circle cx="120" cy="170" r="5" opacity=".8"/><circle cx="870" cy="120" r="4" opacity=".7"/><circle cx="930" cy="420" r="5" opacity=".6"/>
    <circle cx="150" cy="820" r="4" opacity=".6"/><circle cx="330" cy="90" r="3" opacity=".7"/><circle cx="760" cy="900" r="4" opacity=".7"/>
    <circle cx="90" cy="520" r="3" opacity=".6"/><circle cx="600" cy="70" r="3" opacity=".5"/><circle cx="900" cy="700" r="3" opacity=".6"/>
  </g>
  <!-- orbit -->
  <circle cx="470" cy="560" r="330" fill="none" stroke="#f6f1ff" stroke-opacity=".35" stroke-width="10" stroke-dasharray="26 34"/>
  <!-- planet -->
  <circle cx="470" cy="560" r="205" fill="url(#planet)"/>
  <g fill="#9a4f13" opacity=".35"><circle cx="400" cy="620" r="44"/><circle cx="545" cy="500" r="30"/><circle cx="520" cy="660" r="22"/></g>
  <!-- comet leaving on the tangent -->
  <path d="M470 230 Q 640 215 850 120" fill="none" stroke="url(#trail)" stroke-width="54" stroke-linecap="round"/>
  <circle cx="850" cy="120" r="110" fill="url(#glow)"/>
  <circle cx="850" cy="120" r="40" fill="#fff"/>
</svg>
</body></html>
